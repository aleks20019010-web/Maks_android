name: Build Maks Music Android APK

on:
  push:
    branches: [ main, master ]
    paths:
      - 'android/**'
      - '.github/workflows/build-android-apk.yml'
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      include_vosk_model:
        description: 'Вшить оффлайн русскую модель Vosk (~40 МБ) прямо в APK'
        required: true
        default: true
        type: boolean
      build_type:
        description: 'Тип сборки APK'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Cache Vosk Russian model
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.include_vosk_model == true }}
        id: cache-vosk
        uses: actions/cache@v4
        with:
          path: android/app/src/main/assets/models/vosk-model-small-ru-0.22
          key: vosk-model-small-ru-0.22-v2

      - name: Download Vosk Russian model (offline ASR)
        if: ${{ (github.event_name != 'workflow_dispatch' || inputs.include_vosk_model == true) && steps.cache-vosk.outputs.cache-hit != 'true' }}
        run: |
          rm -rf app/src/main/assets/models/vosk-model-small-ru-0.22
          mkdir -p app/src/main/assets/models
          curl -fSL --retry 3 https://alphacephei.com/vosk/models/vosk-model-small-ru-0.22.zip -o /tmp/vosk-ru.zip
          unzip -q /tmp/vosk-ru.zip -d app/src/main/assets/models
          rm -f /tmp/vosk-ru.zip

      - name: Verify Vosk model bundled in assets
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.include_vosk_model == true }}
        run: |
          ls -la app/src/main/assets/models/vosk-model-small-ru-0.22
          test -f app/src/main/assets/models/vosk-model-small-ru-0.22/am/final.mdl
          du -sh app/src/main/assets/models/vosk-model-small-ru-0.22

      - name: Decode Release Keystore (if configured in Secrets)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > app/release-keystore.jks
            echo "KEYSTORE_FILE=$(pwd)/app/release-keystore.jks" >> "$GITHUB_ENV"
          else
            echo "No release keystore secret set — will sign with debug key"
          fi

      - name: Run unit tests (Music Core NLU, Personality, Appraisal)
        run: gradle testDebugUnitTest --stacktrace

      - name: Build Debug APK
        if: ${{ inputs.build_type != 'release' }}
        run: gradle assembleDebug --stacktrace

      - name: Build Release APK
        if: ${{ inputs.build_type == 'release' || startsWith(github.ref, 'refs/tags/v') }}
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --stacktrace

      - name: Collect APK files
        run: |
          mkdir -p ../dist-apk
          find app/build/outputs/apk -name "*.apk" -exec cp -v {} ../dist-apk/ \;
          ls -lh ../dist-apk/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: maks-music-android-apk
          path: dist-apk/*.apk
          retention-days: 30

      - name: Publish GitHub Release (on tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-apk/*.apk
          generate_release_notes: true
